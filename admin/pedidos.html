<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos | MYT Express Admin</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/admin-panel.css">
  <link rel="stylesheet" href="../css/admin-pedidos.css">
</head>
<body class="admin-body">

  <!-- HEADER SUPERIOR -->
  <header class="admin-header">
    <div class="admin-header__contenedor">
      <a href="panel.html" class="admin-header__logo">
        <img src="https://pub-1a9e1895df724843a63ab4872f69867b.r2.dev/logo.png" alt="MYT Express" class="admin-header__logo-img">
        <span class="admin-header__logo-texto">MYT Express</span>
        <span class="admin-header__badge">Admin</span>
      </a>
      <nav class="admin-header__nav">
        <a href="panel.html" class="admin-header__link">📊 Dashboard</a>
        <a href="productos.html" class="admin-header__link">📦 Productos</a>
        <a href="pedidos.html" class="admin-header__link admin-header__link--activo">🛒 Pedidos</a>
      </nav>
      <div class="admin-header__acciones">
        <a href="../index.html" class="admin-header__btn-tienda" target="_blank">🏪 Ver tienda</a>
        <button class="admin-header__btn-logout" id="btnLogout">🚪 Salir</button>
      </div>
      <button class="admin-header__hamburguesa" id="btnAdminHamburguesa">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- MENÚ MÓVIL -->
  <div class="admin-menu-movil" id="adminMenuMovil">
    <div class="admin-menu-movil__header">
      <img src="https://pub-1a9e1895df724843a63ab4872f69867b.r2.dev/logo.png" alt="MYT Express" class="admin-menu-movil__logo">
      <span class="admin-menu-movil__titulo">MYT Express Admin</span>
      <button class="admin-menu-movil__cerrar" id="btnAdminCerrarMenu">✕</button>
    </div>
    <nav class="admin-menu-movil__nav">
      <a href="panel.html" class="admin-menu-movil__link">📊 Dashboard</a>
      <a href="productos.html" class="admin-menu-movil__link">📦 Productos</a>
      <a href="pedidos.html" class="admin-menu-movil__link admin-menu-movil__link--activo">🛒 Pedidos</a>
      <a href="../index.html" class="admin-menu-movil__link">🏪 Ver tienda</a>
    </nav>
    <div class="admin-menu-movil__footer">
      <button class="admin-menu-movil__logout" id="btnLogoutMovil">🚪 Cerrar sesión</button>
    </div>
  </div>
  <div class="admin-header__overlay" id="adminOverlay"></div>

  <!-- CONTENIDO -->
  <main class="admin-contenido">
    <div class="admin-contenido__header">
      <div>
        <h1 class="admin-contenido__titulo">Pedidos</h1>
        <p class="admin-contenido__subtitulo">Gestiona las entregas de tu negocio</p>
      </div>
      <div class="admin-contenido__fecha" id="fechaActual"></div>
    </div>

    <div class="admin-stats admin-stats--mini">
      <div class="admin-stat admin-stat--pedidos">
        <div class="admin-stat__icono">🛒</div>
        <div class="admin-stat__info">
          <span class="admin-stat__numero" id="statTotalPedidos">0</span>
          <span class="admin-stat__label">Total</span>
        </div>
      </div>
      <div class="admin-stat admin-stat--pendientes">
        <div class="admin-stat__icono">⏳</div>
        <div class="admin-stat__info">
          <span class="admin-stat__numero" id="statPedidosPendientes">0</span>
          <span class="admin-stat__label">Pendientes</span>
        </div>
      </div>
      <div class="admin-stat admin-stat--ventas">
        <div class="admin-stat__icono">💰</div>
        <div class="admin-stat__info">
          <span class="admin-stat__numero" id="statTotalVentas">S/ 0</span>
          <span class="admin-stat__label">Ventas</span>
        </div>
      </div>
    </div>

    <div class="pedidos-filtros">
      <button class="pedidos-filtro pedidos-filtro--activo" data-filtro="todos">Todos</button>
      <button class="pedidos-filtro" data-filtro="pendiente">⏳ Pendientes</button>
      <button class="pedidos-filtro" data-filtro="confirmado">✅ Confirmados</button>
      <button class="pedidos-filtro" data-filtro="entregado">🚀 Entregados</button>
    </div>

    <div class="admin-buscador">
      <span>🔍</span>
      <input type="text" id="adminBuscadorPedidos" placeholder="Buscar por nombre o teléfono...">
    </div>

    <div class="pedidos-lista" id="listaPedidos"></div>
  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin-pedidos.js"></script>

</body>
</html>
